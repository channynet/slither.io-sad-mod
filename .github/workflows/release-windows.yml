name: Windows and macOS release
on:
  push:
    tags: ['v2.*-ntl*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test client management server
        run: node --test tools/tag-share-worker/tests/access.test.mjs
      - name: Prepare pinned tools
        run: python tools/prepare_windows.py
      - name: Validate update transactions
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/update_test.ps1
      - name: Test release publication safety
        run: python -m unittest discover -s tests -p test_publish_release.py
      - name: Build clean Windows package
        run: python tools/package_windows.py
      - name: Run native tests
        run: python tools/test_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: SlitherNative-Windows
          path: build/releases/*.zip
  mac:
    uses: ./.github/workflows/build-mac.yml
  publish:
    needs: [windows, mac]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: SlitherNative-*
          merge-multiple: true
          path: release
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_release.py
