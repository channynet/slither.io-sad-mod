name: Windows release
on:
  push:
    tags: ['v2.*-ntl*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare pinned tools
        run: python tools/prepare_windows.py
      - name: Validate update transactions
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/update_test.ps1
      - name: Build clean Windows package
        run: python tools/package_windows.py
      - name: Run native tests
        run: python tools/test_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: SlitherNative-Windows
          path: build/releases/*.zip
      - name: Publish verified tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content tools/build_windows.py -Raw),'APP_VERSION="([^"]+)"').Groups[1].Value
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag does not match application version' }
          $package = "build/releases/SlitherNative-$version-Windows-x64.zip"
          gh release create "$env:GITHUB_REF_NAME" "$package" --verify-tag --title "SlitherNative $version" --generate-notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
