name: macOS build and startup tests
on:
  push:
    branches: [main, codex/native-0.90-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: third_party/snake-missile/go.mod
          cache-dependency-path: third_party/snake-missile/go.sum
      - name: Test local bot engine
        working-directory: third_party/snake-missile
        run: go test -count=1 ./application ./utilities ./cmd/native-worker
      - name: Check startup ordering
        run: |
          mkdir -p build/tests
          clang -std=gnu11 -DGLFW_INCLUDE_NONE -DGLFW_INCLUDE_VULKAN -Iglfw/include -Ithermite/include -Ithermite/src -Ithird_party/vulkan/include tests/window_startup_test.c thermite/src/core/tentry.c -o build/tests/window_startup
          build/tests/window_startup
      - name: Test saved skin library
        run: |
          clang -std=gnu11 tests/skin_library_test.c app/src/game/skin_library.c app/src/external/mongoose.c -o build/tests/skin_library
          cd build/tests && ./skin_library
      - name: Test random skin generator
        run: |
          clang -std=gnu11 -O1 tests/skin_generator_test.c app/src/game/skin_generator.c app/src/external/quickjs-ng/quickjs-amalgam.c -o build/tests/skin_generator
          build/tests/skin_generator
      - name: Build Universal application
        run: python3 tools/build_unix.py --jobs 3
      - name: Test bundled bot controls and shutdown
        run: |
          export SLITHER_MISSILE_WORKER_TEST="$PWD/dist/SlitherNative.app/Contents/Resources/app/res/swarm/worker"
          cd third_party/snake-missile
          go test -count=1 -run TestWorkerModesAndWatchdog ./application
      - name: Test HTTP response limits and tag sharing
        run: |
          clang -std=gnu11 -O1 tests/http_simple_test.c -lcurl -o build/tests/http_simple
          python3 tools/test_http_simple.py build/tests/http_simple
          clang -std=gnu11 -O1 -DGLFW_INCLUDE_NONE -DGLFW_INCLUDE_VULKAN -DCIMGUI_NO_EXPORT -Iglfw/include -Ithermite/include -Ithermite/src -Ithird_party/vulkan/include -ffunction-sections -fdata-sections -Wl,-dead_strip tests/tag_share_worker_test.c app/src/network/tag_share_proto.c app/src/external/mongoose.c app/src/platform/compat.c -o build/tests/tag_share_worker
          cd build/tests && ./tag_share_worker
      - name: Test updater validation and transactions
        run: |
          clang -fobjc-arc -Wno-deprecated-declarations -Ithird_party/libarchive tests/mac_update_test.m -framework Foundation -larchive -o build/tests/mac_update
          version=$(python3 -c 'import re; from pathlib import Path; print(re.search(r"APP_VERSION=\"([^\"]+)\"", Path("tools/build_windows.py").read_text()).group(1))')
          build/tests/mac_update "dist/SlitherNative-$version-macOS-Universal.zip" "$version"
      - name: Verify architectures and signature
        run: |
          lipo dist/SlitherNative.app/Contents/MacOS/SlitherNative -verify_arch arm64 x86_64
          lipo dist/SlitherNative.app/Contents/MacOS/SlitherUpdater -verify_arch arm64 x86_64
          lipo dist/SlitherNative.app/Contents/Resources/app/res/swarm/worker -verify_arch arm64 x86_64
          codesign --verify --strict dist/SlitherNative.app/Contents/Resources/app/res/swarm/worker
          codesign --verify --deep --strict dist/SlitherNative.app
          otool -L dist/SlitherNative.app/Contents/MacOS/SlitherNative
      - name: Test windowed and fullscreen startup
        run: python3 tools/test_mac_startup.py
      - name: Include corresponding source
        run: git archive --format=zip --output=dist/SlitherNative-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: SlitherNative-macOS
          path: dist/*.zip
          retention-days: 30
