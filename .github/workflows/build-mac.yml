name: macOS build and startup tests
on:
  push:
    branches: [main, codex/native-0.90-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check startup ordering
        run: |
          mkdir -p build/tests
          clang -std=gnu11 -DGLFW_INCLUDE_NONE -DGLFW_INCLUDE_VULKAN -Iglfw/include -Ithermite/include -Ithermite/src -Ithird_party/vulkan/include tests/window_startup_test.c thermite/src/core/tentry.c -o build/tests/window_startup
          build/tests/window_startup
      - name: Build Universal application
        run: python3 tools/build_unix.py --jobs 3
      - name: Test updater validation and transactions
        run: |
          clang -fobjc-arc -Wno-deprecated-declarations -Ithird_party/libarchive tests/mac_update_test.m -framework Foundation -larchive -o build/tests/mac_update
          version=$(python3 -c 'import re; from pathlib import Path; print(re.search(r"APP_VERSION=\"([^\"]+)\"", Path("tools/build_windows.py").read_text()).group(1))')
          build/tests/mac_update "dist/SlitherNative-$version-macOS-Universal.zip" "$version"
      - name: Verify architectures and signature
        run: |
          lipo dist/SlitherNative.app/Contents/MacOS/SlitherNative -verify_arch arm64 x86_64
          lipo dist/SlitherNative.app/Contents/MacOS/SlitherUpdater -verify_arch arm64 x86_64
          codesign --verify --deep --strict dist/SlitherNative.app
          otool -L dist/SlitherNative.app/Contents/MacOS/SlitherNative
      - name: Test windowed and fullscreen startup
        run: python3 tools/test_mac_startup.py
      - name: Include corresponding source
        run: git archive --format=zip --output=dist/SlitherNative-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: SlitherNative-macOS
          path: dist/*.zip
          retention-days: 30
